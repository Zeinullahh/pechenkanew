# Nginx configuration for silenceai.net
# Static site served by PM2
# Place this file at: /etc/nginx/sites-available/silenceai.net

# HTTP to HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name silenceai.net www.silenceai.net;
    return 301 https://$server_name$request_uri;
}

# Main HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name silenceai.net www.silenceai.net;

    # SSL certificates (managed by certbot)
    ssl_certificate /etc/letsencrypt/live/silenceai.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/silenceai.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml+rss image/svg+xml;
    gzip_comp_level 6;

    # Root directory for static files (Next.js output 'export')
    root /home/ubuntu/pechenka/out;
    index index.html;

    # Redirects (from old Next.js routes)
    location = /developer-services { return 301 /services/; }
    location ^~ /developer-services/ { return 301 /services/; }
    location = /slnc-code { return 301 /slnc-env/; }
    location ^~ /slnc-code/ { return 301 /slnc-env/; }

    # Cache static assets aggressively (Immutable Next.js assets)
    location /_next/static/ {
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Cache images and fonts
    location ~* \.(ico|css|js|gif|jpeg|jpg|png|svg|webp|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # Main location - Serve Static Files + Handle Trailing Slashes
    location / {
        # Try finding file, then directory (trailing slash), then 404
        try_files $uri $uri/index.html $uri/ =404;
        
        # HTML Caching: Do NOT cache HTML. Always check with server if there's a new version.
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # Error pages
    error_page 404 /404/index.html;
    error_page 500 502 503 504 /500.html;
}
